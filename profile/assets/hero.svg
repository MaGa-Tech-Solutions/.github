<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="MaGaTech // solutions — Custom software, sell more, work less">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1.5" y="1.5" width="1197" height="377" rx="24"/>
    </clipPath>
    <clipPath id="rule">
      <rect x="420" y="226" width="360" height="3" rx="1.5"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="24" fill="#060a14"/>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="380" fill="url(#grid)"/>
    <ellipse cx="180" cy="40" rx="560" ry="300" fill="url(#glowCyan)"/>
    <ellipse cx="1040" cy="360" rx="560" ry="300" fill="url(#glowViolet)"/>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="377" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M30 52 V38 a8 8 0 0 1 8-8 H52"/>
    <path d="M1148 30 h14 a8 8 0 0 1 8 8 V52"/>
    <path d="M1170 328 v14 a8 8 0 0 1 -8 8 h-14"/>
    <path d="M52 350 H38 a8 8 0 0 1 -8-8 V328"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="112" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-weight="500" font-size="16" letter-spacing="6" fill="#22d3ee" opacity="0.9">// MEXICAN SOFTWARE STUDIO</text>

  <!-- wordmark -->
  <text x="600" y="196" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-weight="700" font-size="60">
    <tspan fill="#f1f5f9">MaGaTech</tspan><tspan fill="url(#accent)"> // </tspan><tspan fill="#cbd5e1">solutions</tspan>
  </text>

  <!-- accent rule + shimmer -->
  <rect x="420" y="226" width="360" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>
  <g clip-path="url(#rule)">
    <rect x="420" y="226" width="90" height="3" fill="#ffffff" opacity="0.55">
      <animate attributeName="x" values="330;780;330" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tagline -->
  <text x="600" y="276" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-weight="400" font-size="19" fill="#94a3b8">Custom software &#8212; your business sells more and works less.</text>

  <!-- status line -->
  <circle cx="452" cy="326" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="466" y="331" font-family="'Fira Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-weight="400" font-size="14" fill="#67e8f9" opacity="0.85">status: open for new projects &#183; reply &lt;24h</text>
</svg>
